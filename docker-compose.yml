version: '3.8'

services:
  # 1. Local PostgreSQL Database Container eka
  postgres_db:
    image: postgres:15-alpine
    container_name: pos_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
      POSTGRES_DB: pos_local_db
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Spring Boot Backend Container eka
  backend:
    build: .
    container_name: pos_backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres_db
    environment:
      # Meken oyage NeonDB link eka wenawata, Docker eke local DB eka use karanna kiyanawa
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/pos_local_db
      SPRING_DATASOURCE_USERNAME: pos_user
      SPRING_DATASOURCE_PASSWORD: pos_password
      # Flyway validation auto wena nisa, Hibernate eken tables auto hadanna kiyanawa (test karanna lesi wenna)
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  pg_data: